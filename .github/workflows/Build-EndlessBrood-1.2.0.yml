        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: ForgeGradle build and reobfuscation
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Check compiled JAR
        shell: bash
        run: |
          find build/libs -maxdepth 1 -name '*.jar' -type f -ls
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload Endless Brood JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-v1.2.0
          path: build/libs/*.jar
          if-no-files-found: error
