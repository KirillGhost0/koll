name: Build Endless Brood 1.3.1 FINAL PURIFICATION
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.3.1-FINAL-PURIFICATION.yml'
      - 'EndlessBrood-1.7.10-v1.3.1-FINAL-PURIFICATION-SOURCE.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
      - name: Verify the source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f EndlessBrood-1.7.10-v1.3.1-FINAL-PURIFICATION-SOURCE.zip || { echo '::error::Put the SOURCE.zip in the repository root alongside README.md'; exit 1; }
          echo 'f309f6fcacb3573c9407edf97638278aaa808a27a12be1058afa6ee5c60eff1c  EndlessBrood-1.7.10-v1.3.1-FINAL-PURIFICATION-SOURCE.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/endlessbrood-src"
          unzip -q EndlessBrood-1.7.10-v1.3.1-FINAL-PURIFICATION-SOURCE.zip -d "$RUNNER_TEMP/endlessbrood-src"
          test -f "$RUNNER_TEMP/endlessbrood-src/build.gradle"
          grep -q '^version=1.3.1-victory$' "$RUNNER_TEMP/endlessbrood-src/gradle.properties"
      - name: Install Java 8 for Forge 1.7.10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Run source and texture smoke tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/endlessbrood-src"
          bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Compile and reobfuscate Minecraft Forge 1.7.10 mod
        shell: bash
        run: |
          cd "$RUNNER_TEMP/endlessbrood-src"
          gradle --no-daemon --stacktrace clean setupDecompWorkspace build
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"
      - name: Upload one installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.3.1-FINAL-PURIFICATION
          path: ${{ runner.temp }}/endlessbrood-src/build/libs/*.jar
          if-no-files-found: error
