name: Build Endless Brood 1.3.7 HOTFIX1

on:
  workflow_dispatch:
  push:
    paths:
      - 'EndlessBrood-1.7.10-v1.3.7-HOTFIX1-SOURCE.zip'
      - '.github/workflows/Build-EndlessBrood-1.3.7-HOTFIX1.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate and extract HOTFIX1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          file='EndlessBrood-1.7.10-v1.3.7-HOTFIX1-SOURCE.zip'
          test -f "$file" || { echo "::error::Upload $file to the repository ROOT next to README.md"; exit 1; }
          echo '78063bd76653be0823579a76e6bb09cb8ada6182572ceba0378b6dc53e1163a3  EndlessBrood-1.7.10-v1.3.7-HOTFIX1-SOURCE.zip' | sha256sum -c -
          mkdir -p source
          unzip -q "$file" -d source
          test -f source/build.gradle
          grep -q '^version=1.3.7-mutating-horror-hotfix1$' source/gradle.properties
          grep -q 'world.isAirBlock(nx, ny + 1, nz)' source/src/main/java/com/endlessbrood/common/BlockTaintedSoil.java
      - name: Java 8 for Minecraft Forge 1.7.10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Standalone smoke tests
        working-directory: source
        run: bash scripts/smoke-test.sh
      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Compile and reobfuscate Forge mod
        working-directory: source
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Confirm built JAR
        shell: bash
        run: |
          find source/build/libs -maxdepth 1 -type f -name '*.jar' -ls
          test -n "$(find source/build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.3.7-HOTFIX1-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
