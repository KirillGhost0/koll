name: Build Endless Brood 1.3.7 Mutating Horror

on:
  workflow_dispatch:
  push:
    paths:
      - 'EndlessBrood-1.7.10-v1.3.7-MUTATING-HORROR-SOURCE.zip'
      - '.github/workflows/Build-EndlessBrood-1.3.7-MUTATING-HORROR.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
      - name: Verify source archive and extract
        shell: bash
        run: |
          test -f EndlessBrood-1.7.10-v1.3.7-MUTATING-HORROR-SOURCE.zip || {
            echo 'ERROR: upload the SOURCE ZIP to the REPOSITORY ROOT (not .github/workflows)'; exit 1;
          }
          mkdir -p source
          unzip -q EndlessBrood-1.7.10-v1.3.7-MUTATING-HORROR-SOURCE.zip -d source
          test -f source/build.gradle
          test -f source/src/main/java/com/endlessbrood/common/BroodVisualEvolution.java
      - name: Java 8 for Forge 1.7.10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Independent code and resource regression tests
        working-directory: source
        run: bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Compile and reobfuscate Minecraft Forge mod
        working-directory: source
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Ensure nonempty installable JAR was produced
        shell: bash
        run: |
          find source/build/libs -maxdepth 1 -name '*.jar' -type f -ls
          test -n "$(find source/build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"
      - name: Upload resulting mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.3.7-MUTATING-HORROR-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
