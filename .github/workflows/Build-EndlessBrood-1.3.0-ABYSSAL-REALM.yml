name: Build Endless Brood 1.3.0 ABYSSAL REALM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.3.0-ABYSSAL-REALM.yml'
      - 'EndlessBrood-1.7.10-v1.3.0-ABYSSAL-REALM-SOURCE.zip'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f EndlessBrood-1.7.10-v1.3.0-ABYSSAL-REALM-SOURCE.zip || { echo '::error::Upload the SOURCE.zip at the repository root next to README.md'; exit 1; }
          echo 'bb9f24f13cfe383bf405052dced9a3348fdf746ef3c13af4b73a12a46c4ac842  EndlessBrood-1.7.10-v1.3.0-ABYSSAL-REALM-SOURCE.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/eb-src"
          unzip -q EndlessBrood-1.7.10-v1.3.0-ABYSSAL-REALM-SOURCE.zip -d "$RUNNER_TEMP/eb-src"
          test -f "$RUNNER_TEMP/eb-src/build.gradle"
          grep -q '^version=1.3.0-abyssal-realm$' "$RUNNER_TEMP/eb-src/gradle.properties"
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Source smoke tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/eb-src"
          bash scripts/smoke-test.sh
      - name: Install Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Build Forge JAR
        shell: bash
        run: |
          cd "$RUNNER_TEMP/eb-src"
          gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.3.0-Abyssal-Realm
          path: ${{ runner.temp }}/eb-src/build/libs/*.jar
          if-no-files-found: error
