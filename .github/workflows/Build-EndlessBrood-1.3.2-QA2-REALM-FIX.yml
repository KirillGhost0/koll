name: Build Endless Brood 1.3.2 QA2 REALM FIX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.3.2-QA2-REALM-FIX.yml'
      - 'EndlessBrood-1.7.10-v1.3.2-QA2-REALM-FIX-SOURCE.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and unpack QA2 project
        shell: bash
        run: |
          set -euo pipefail
          file='EndlessBrood-1.7.10-v1.3.2-QA2-REALM-FIX-SOURCE.zip'
          if [[ ! -f "$file" ]]; then
            echo '::error title=Missing source::Upload QA2 SOURCE zip to repository root next to README.md.'
            exit 1
          fi
          echo 'ae7f3022aec708ee546f2ed57ff69af3a8684138377170ebfc89bc9e125bfdca  EndlessBrood-1.7.10-v1.3.2-QA2-REALM-FIX-SOURCE.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/eb-qa2"
          unzip -q "$file" -d "$RUNNER_TEMP/eb-qa2"
          grep -q '^version=1.3.2-qa2-realmfix$' "$RUNNER_TEMP/eb-qa2/gradle.properties"
      - name: Install Java 8 for Minecraft Forge 1.7.10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Headless regression tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/eb-qa2"
          bash scripts/smoke-test.sh
      - name: Install Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Compile with ForgeGradle
        shell: bash
        run: |
          cd "$RUNNER_TEMP/eb-qa2"
          gradle --no-daemon --stacktrace clean setupDecompWorkspace build
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.3.2-QA2-REALM-FIX-JAR
          path: ${{ runner.temp }}/eb-qa2/build/libs/*.jar
          if-no-files-found: error
