name: Build Endless Brood 1.2.10 SMOOTH AI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.2.10-SMOOTH-AI.yml'
      - 'EndlessBrood-1.7.10-v1.2.10-SMOOTH-AI-SOURCE.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack matching source release
        shell: bash
        run: |
          set -euo pipefail
          test -f 'EndlessBrood-1.7.10-v1.2.10-SMOOTH-AI-SOURCE.zip' || { echo 'Missing source ZIP in repository root'; exit 1; }
          echo '3b30e5a2a5e60812d7090e9d51adfa26f153b9c06c025852b2cfbbc3f9272693  EndlessBrood-1.7.10-v1.2.10-SMOOTH-AI-SOURCE.zip' | sha256sum -c -
          unzip -oq 'EndlessBrood-1.7.10-v1.2.10-SMOOTH-AI-SOURCE.zip' -d .
          grep -q '^version=1.2.10-smooth-ai$' gradle.properties
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Standalone smoke tests
        run: bash scripts/smoke-test.sh
      - name: Setup Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Build Forge mod
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Verify JAR generated
        run: test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.10-SMOOTH-AI
          path: build/libs/*.jar
          if-no-files-found: error
