      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Check gameplay rules, UV texture packing and model syntax
        run: bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Build Forge 1.7.10 JAR
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Verify JAR is produced
        shell: bash
        run: |
          find build/libs -maxdepth 1 -name '*.jar' -type f -ls
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"
      - name: Upload single mod file
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.4-HORROR
          path: build/libs/*.jar
          if-no-files-found: error
