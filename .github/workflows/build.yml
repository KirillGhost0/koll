name: Build Minecraft 1.7.10 mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 8 for Forge 1.7.10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Pure Java and texture smoke tests
        run: bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: ForgeGradle compilation and reobfuscation
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Check installable mod artifact
        run: |
          find build/libs -maxdepth 1 -name '*.jar' -type f -ls
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.0.0-rc2
          path: build/libs/*.jar
          if-no-files-found: error
