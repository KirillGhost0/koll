name: Build Endless Brood 1.3.2 VICTORY RELICS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.3.2-VICTORY-RELICS.yml'
      - 'EndlessBrood-1.7.10-v1.3.2-VICTORY-RELICS-SOURCE.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          test -f EndlessBrood-1.7.10-v1.3.2-VICTORY-RELICS-SOURCE.zip || { echo '::error::Upload EndlessBrood-1.7.10-v1.3.2-VICTORY-RELICS-SOURCE.zip to the repository root, alongside README.md'; exit 1; }
          echo '37a9a057bf673c6b5a3953cf7ee9047a43431c103aec20fc423bb7593e17b94d  EndlessBrood-1.7.10-v1.3.2-VICTORY-RELICS-SOURCE.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/endlessbrood-src"
          unzip -q EndlessBrood-1.7.10-v1.3.2-VICTORY-RELICS-SOURCE.zip -d "$RUNNER_TEMP/endlessbrood-src"
          test -f "$RUNNER_TEMP/endlessbrood-src/build.gradle"
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Check project structure and resources
        shell: bash
        run: |
          cd "$RUNNER_TEMP/endlessbrood-src"
          bash scripts/smoke-test.sh
      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Build and reobfuscate Forge 1.7.10 JAR
        shell: bash
        run: |
          cd "$RUNNER_TEMP/endlessbrood-src"
          gradle --no-daemon --stacktrace clean setupDecompWorkspace build
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.3.2-VICTORY-RELICS
          path: ${{ runner.temp }}/endlessbrood-src/build/libs/*.jar
          if-no-files-found: error
