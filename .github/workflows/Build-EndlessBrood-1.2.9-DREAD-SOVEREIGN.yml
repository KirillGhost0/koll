      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke tests
        run: bash scripts/smoke-test.sh
      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: ForgeGradle build
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Check JAR
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.9-DREAD-SOVEREIGN
          path: build/libs/*.jar
          if-no-files-found: error
