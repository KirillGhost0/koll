      - name: Java 8 (Minecraft 1.7.10 Forge)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Run isolated smoke tests
        run: bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Compile and reobfuscate Forge mod
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Ensure resulting JAR exists
        run: |
          find build/libs -maxdepth 1 -name '*.jar' -type f -ls
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"
      - name: Upload one combined mod
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.3-WAVEFIX2
          path: build/libs/*.jar
          if-no-files-found: error
