      - name: Restore project files
        shell: bash
        run: |
          base64 --decode /tmp/eb111_source.b64 > /tmp/EndlessBrood-v1.1.1-SOURCE.zip
          unzip -oq /tmp/EndlessBrood-v1.1.1-SOURCE.zip -d .
          rm /tmp/eb111_source.b64
          test -f src/main/java/com/endlessbrood/common/BroodRadiationBridge.java
          test -f src/main/java/com/endlessbrood/common/BroodRadiationBehavior.java
          grep -q 'version=1.1.1' gradle.properties
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Run pure Java tests
        shell: bash
        run: bash scripts/smoke-test.sh
      - name: Install Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: ForgeGradle compile and reobfuscate
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Confirm compiled mod exists
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' -ls
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload single mod jar
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-v1.1.1
          path: build/libs/*.jar
          if-no-files-found: error
