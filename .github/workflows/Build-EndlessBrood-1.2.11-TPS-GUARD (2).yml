name: Build Endless Brood 1.2.11 TPS GUARD

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.2.11-TPS-GUARD.yml'
      - 'EndlessBrood-1.7.10-v1.2.11-TPS-GUARD-SOURCE.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and unpack source
        shell: bash
        run: |
          set -euo pipefail
          echo 'Files in repository root:'
          ls -lh | head -80
          file='EndlessBrood-1.7.10-v1.2.11-TPS-GUARD-SOURCE.zip'
          if [[ ! -f "$file" ]]; then
            echo '::error title=Missing source archive::Upload EndlessBrood-1.7.10-v1.2.11-TPS-GUARD-SOURCE.zip to repository ROOT alongside README.md (not to .github/workflows).'
            exit 1
          fi
          echo '67dad4f3588013063073fec9ab6492ad728e8f6f3984f3ee85716c73e60f3d84  EndlessBrood-1.7.10-v1.2.11-TPS-GUARD-SOURCE.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/endlessbrood-src"
          unzip -q "$file" -d "$RUNNER_TEMP/endlessbrood-src"
          grep -q '^version=1.2.11-tps-guard$' "$RUNNER_TEMP/endlessbrood-src/gradle.properties"
          test -f "$RUNNER_TEMP/endlessbrood-src/build.gradle"
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Check project smoke tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/endlessbrood-src"
          bash scripts/smoke-test.sh
      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Build Forge 1.7.10 mod
        shell: bash
        run: |
          cd "$RUNNER_TEMP/endlessbrood-src"
          gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Verify game JAR
        shell: bash
        run: |
          ls -lh "$RUNNER_TEMP/endlessbrood-src/build/libs/"
          test -n "$(find "$RUNNER_TEMP/endlessbrood-src/build/libs/" -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload game JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.11-TPS-GUARD
          path: ${{ runner.temp }}/endlessbrood-src/build/libs/*.jar
          if-no-files-found: error
