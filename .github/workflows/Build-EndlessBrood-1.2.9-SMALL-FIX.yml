name: Build Endless Brood 1.2.9 (fixed)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/Build-EndlessBrood-1.2.9-SMALL-FIX.yml'
      - 'EndlessBrood-1.7.10-v1.2.9-DREAD-SOVEREIGN-SOURCE.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate and unpack project source
        shell: bash
        run: |
          set -euo pipefail
          test -f 'EndlessBrood-1.7.10-v1.2.9-DREAD-SOVEREIGN-SOURCE.zip' || { echo 'Source ZIP is missing from repository root'; exit 1; }
          echo '650bdef99bcb2b4703826978c1f3ffe0c016016b283af1fc526a5f5ddad3de07  EndlessBrood-1.7.10-v1.2.9-DREAD-SOVEREIGN-SOURCE.zip' | sha256sum -c -
          unzip -oq 'EndlessBrood-1.7.10-v1.2.9-DREAD-SOVEREIGN-SOURCE.zip' -d .
          grep -q '^version=1.2.9-dread-sovereign$' gradle.properties
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke tests
        run: bash scripts/smoke-test.sh
      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: ForgeGradle compile and reobfuscate
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Verify JAR
        run: test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.9-DREAD-SOVEREIGN
          path: build/libs/*.jar
          if-no-files-found: error
