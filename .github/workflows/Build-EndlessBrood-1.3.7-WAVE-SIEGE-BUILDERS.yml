name: Build Endless Brood 1.3.7 Wave Siege Builders

on:
  workflow_dispatch:
  push:
    paths:
      - 'EndlessBrood-1.7.10-v1.3.7-WAVE-SIEGE-BUILDERS-SOURCE.zip'
      - '.github/workflows/Build-EndlessBrood-1.3.7-WAVE-SIEGE-BUILDERS.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate and unpack source
        shell: bash
        run: |
          set -euo pipefail
          file='EndlessBrood-1.7.10-v1.3.7-WAVE-SIEGE-BUILDERS-SOURCE.zip'
          test -f "$file" || { echo "::error::Missing $file in repository root"; exit 1; }
          echo '3670cd0f4f818e3ed68bbe0cab64b8820ed346abb7162d193ea485ec9606a815  EndlessBrood-1.7.10-v1.3.7-WAVE-SIEGE-BUILDERS-SOURCE.zip' | sha256sum -c -
          mkdir -p source
          unzip -q "$file" -d source
          test -f source/build.gradle
          grep -q '^version=1.3.7-builder-siege50-hotfix3$' source/gradle.properties
          test -f source/src/main/java/com/endlessbrood/common/BroodSiegeBuilderRules.java
          test -f source/src/main/java/com/endlessbrood/common/EntityBroodBuilder.java
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Run tests (not a Minecraft runtime test)
        working-directory: source
        run: bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Forge compile and reobfuscate
        working-directory: source
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Verify JAR
        shell: bash
        run: |
          find source/build/libs -maxdepth 1 -type f -name '*.jar' -ls
          test -n "$(find source/build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-WAVE-SIEGE-BUILDERS-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
