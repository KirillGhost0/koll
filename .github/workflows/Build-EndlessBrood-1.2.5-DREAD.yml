      - name: Install Java 8 for Minecraft Forge 1.7.10
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Test model syntax, rules, OGG sounds and UV
        run: bash scripts/smoke-test.sh
      - name: Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'
      - name: Build installable Forge JAR
        run: gradle --no-daemon --stacktrace clean setupDecompWorkspace build
      - name: Verify compiled output
        shell: bash
        run: |
          find build/libs -maxdepth 1 -name '*.jar' -type f -ls
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBrood-1.7.10-1.2.5-DREAD
          path: build/libs/*.jar
          if-no-files-found: error
